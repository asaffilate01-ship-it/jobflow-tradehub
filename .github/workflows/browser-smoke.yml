name: Craftvaro UK-DE browser smoke

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.craftvaro.config.ts"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.craftvaro.config.ts
